<div class="relative group py-2">
  <!-- Pallino dorato: centrato perfettamente sulla linea del padre tramite trasformazione -->
<div
  class="absolute -left-[39px] sm:-left-[56px] top-1/2 -translate-y-1/2 w-3.5 h-3.5 rounded-full bg-amber-400 shadow-[0_0_15px_rgba(212,175,55,1)] z-20 group-hover:scale-150 group-hover:bg-amber-300 transition-all duration-300"
></div>
  <!-- Contenitore Card -->
  <div
    class="bg-luxury-card rounded-xl luxury-glow-card overflow-hidden flex relative group-hover:-translate-y-1 transition-all duration-400 min-h-[130px]"
  >
    <!-- Immagine fusa sulla destra -->
    <div
      class="absolute inset-y-0 right-0 w-2/3 sm:w-1/2 overflow-hidden opacity-40 group-hover:opacity-70 transition-opacity duration-700 z-0"
    >
      <img
        [src]="event()!.imageUrl"
        [alt]="event()!.title"
        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000 mix-blend-overlay"
      />
      <div
        class="absolute inset-0 bg-gradient-to-r from-luxury-card via-luxury-card/90 to-transparent"
      ></div>
    </div>

    <!-- Testo in primo piano -->
    <div
      class="relative z-10 p-5 sm:p-6 w-full sm:w-3/4 flex flex-col justify-center space-y-2"
    >
      <div class="flex items-center gap-3">
        <span
          class="text-2xl sm:text-3xl font-cinzel font-bold text-amber-500/30 group-hover:text-amber-500/60 transition-colors"
        >
          {{event()!.year}}
        </span>
        <span
          class="px-2 py-0.5 rounded border border-amber-500/30 text-[10px] uppercase tracking-widest text-amber-400 bg-amber-500/10 shadow-sm"
        >
          {{event()!.badge}}
        </span>
      </div>

      <h3
        class="text-lg sm:text-xl font-cinzel font-bold text-white group-hover:text-amber-300 transition-colors"
      >
        {{event()!.title}}
      </h3>

      <p
        class="text-sm sm:text-base text-gray-400 leading-relaxed font-light font-playfair italic line-clamp-3"
      >
        "{{event()!.desc}}"
      </p>
    </div>
  </div>
</div>
